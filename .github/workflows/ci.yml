name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: Offline replay must work without any credentials
        env:
          DEVIN_API_KEY: ""
          GITHUB_TOKEN: ""
        run: swarm replay --dir fixtures/$(ls fixtures | head -1)
