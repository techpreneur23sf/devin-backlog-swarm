# Hand-curated backlog for the Superset fork.
#
# Tier 1 (mechanically automatable) is generated by `swarm scan` from real
# scanner output and is deliberately not listed here. What follows is tiers 2
# and 3: the work that decides whether this system is interesting. Every entry
# names the files, the acceptance criteria and the exact verification command,
# because the quality of the issue is the ceiling on the quality of the PR.
#
# `touch_scope` feeds the conflict-aware scheduler; scopes are kept disjoint so
# the swarm can actually run these in parallel.

setup: |
  The repository's Python environment is pre-built in the session snapshot. If
  it is missing, recreate it once, from the repo root:

      sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev \
        pkg-config build-essential libsasl2-dev libldap2-dev
      curl -LsSf https://astral.sh/uv/install.sh | sh
      uv venv --python 3.11 .venv && . .venv/bin/activate
      uv pip install -r requirements/development.txt && uv pip install -e .

  Targeted unit tests then run in seconds. Do not run the full test suite, do
  not build the frontend, and do not start Superset.

issues:
  - id: tz-dates-util
    tier: 2
    class: deprecation
    title: "Replace pytz with the stdlib zoneinfo in superset/utils/dates.py"
    touch_scope: ["superset/utils/dates.py"]
    problem: |
      `superset/utils/dates.py` still converts through `pytz`, which is in
      maintenance mode and whose `localize()` API has no stdlib equivalent —
      the correct replacement differs by call site:

      - `dttm.astimezone(pytz.utc)` is a conversion of an aware datetime and
        maps cleanly onto `datetime.timezone.utc`.
      - `pytz.utc.localize(EPOCH)` *attaches* a timezone to the naive `EPOCH`
        constant. Writing `EPOCH.astimezone(...)` instead would silently
        reinterpret it in the machine's local timezone and shift every epoch
        conversion in Superset by the local UTC offset.

      Migrate the module off `pytz` while preserving the semantics of each call
      site, and leave `EPOCH` naive so callers that pass naive datetimes keep
      the current behaviour.
    affected_paths: ["superset/utils/dates.py"]
    acceptance:
      - "`superset/utils/dates.py` no longer imports `pytz`"
      - "`datetime_to_epoch` returns identical values for naive and aware inputs, including for a non-UTC aware input"
      - "The naive branch (`dttm - EPOCH`) is unchanged in behaviour"
      - "No other module is modified"
    verify:
      - "python -m pytest tests/unit_tests/models/helpers_test.py tests/unit_tests/utils/test_date_parsing.py -q"
      - "python -c \"from datetime import datetime, timezone, timedelta; from superset.utils.dates import datetime_to_epoch; assert datetime_to_epoch(datetime(2020,1,1)) == 1577836800000.0; assert datetime_to_epoch(datetime(2020,1,1,tzinfo=timezone(timedelta(hours=5)))) == 1577818800000.0; print('ok')\""

  - id: tz-cron-util
    tier: 2
    class: deprecation
    title: "Replace pytz with zoneinfo in the alert/report cron window, preserving DST behaviour"
    touch_scope: ["superset/tasks/cron_util.py"]
    problem: |
      `superset/tasks/cron_util.py` builds the alerts-and-reports scheduling
      window with `pytz.timezone(...)`. This is the call site where a naive
      find-and-replace is actively dangerous: `pytz` timezone objects carry a
      fixed historical offset until `localize()`/`normalize()` is called, while
      `zoneinfo.ZoneInfo` resolves the offset from the datetime itself. Reports
      scheduled across a DST boundary are exactly the case that breaks.

      Migrate to `zoneinfo`, keep the invalid-timezone fallback to UTC (with the
      same warning log), and keep yielding *naive UTC* datetimes, which is what
      the caller and the persisted schedule expect.
    affected_paths: ["superset/tasks/cron_util.py"]
    acceptance:
      - "`superset/tasks/cron_util.py` no longer imports `pytz`"
      - "An unknown timezone still falls back to UTC and logs the same warning"
      - "Yielded datetimes are still naive and in UTC"
      - "The existing DST parametrisations in tests/unit_tests/tasks/test_cron_util.py pass unchanged"
    verify:
      - "python -m pytest tests/unit_tests/tasks/test_cron_util.py -q"

  - id: tz-report-schemas
    tier: 2
    class: deprecation
    title: "Drop pytz from the report schemas and email notification timezone handling"
    touch_scope: ["superset/reports/schemas.py", "superset/reports/notifications/email.py"]
    problem: |
      `superset/reports/schemas.py` validates the report timezone against
      `pytz.all_timezones` and `superset/reports/notifications/email.py` uses
      `pytz.timezone`. The stdlib equivalent, `zoneinfo.available_timezones()`,
      returns an unordered `set`, so a naive substitution makes the API's
      validation error message — which lists the accepted values, and which an
      integration test asserts on — non-deterministic between processes.

      Migrate both modules to `zoneinfo`, keeping the choices deterministic and
      the accepted timezone set at least as permissive as today's.
    affected_paths: ["superset/reports/schemas.py", "superset/reports/notifications/email.py"]
    acceptance:
      - "Neither module imports `pytz`"
      - "The `OneOf` choices are deterministically ordered (sorted), not set-ordered"
      - "Every timezone previously accepted is still accepted"
      - "tests/unit_tests/reports/schemas_test.py passes"
    verify:
      - "python -m pytest tests/unit_tests/reports/schemas_test.py -q"
      - "python -c \"import superset.reports.schemas as s; assert 'pytz' not in open(s.__file__).read(); print('ok')\""

  - id: tz-model-helpers
    tier: 2
    class: deprecation
    title: "Use datetime.timezone.utc instead of pytz.utc in model helpers"
    touch_scope: ["superset/models/helpers.py"]
    problem: |
      `superset/models/helpers.py` imports `pytz` for a single UTC conversion in
      the `changed_on_dttm`/ISO serialisation path. Replace it with
      `datetime.timezone.utc` and drop the dependency from the module. Watch the
      naive-vs-aware distinction: `changed_on` is stored naive UTC, so calling
      `astimezone` on it would reinterpret it in local time.
    affected_paths: ["superset/models/helpers.py"]
    acceptance:
      - "`superset/models/helpers.py` no longer imports `pytz`"
      - "Serialised timestamps are byte-identical for a naive UTC `changed_on`"
      - "tests/unit_tests/models/helpers_test.py passes"
    verify:
      - "python -m pytest tests/unit_tests/models/helpers_test.py -q"

  - id: pep585-typing
    tier: 2
    class: code-quality
    title: "Modernise typing imports to PEP 585 builtin generics in three modules"
    touch_scope:
      - "superset/daos/chart.py"
      - "superset/reports/notifications/slackv2.py"
      - "superset/mcp_service/chart/validation/runtime/format_validator.py"
    problem: |
      Three modules still import `Dict`, `List` and `Tuple` from `typing` while
      the rest of the codebase uses builtin generics. Replace the annotations
      with `dict[...]`, `list[...]` and `tuple[...]`, remove the now-unused
      imports, and leave `Union`/`Optional` alone where removing them would
      change runtime behaviour under `from __future__ import annotations`.
    affected_paths:
      - "superset/daos/chart.py"
      - "superset/reports/notifications/slackv2.py"
      - "superset/mcp_service/chart/validation/runtime/format_validator.py"
    acceptance:
      - "No `from typing import Dict|List|Tuple` remains in the three modules"
      - "`ruff check` passes on the three files"
      - "The modules still import cleanly"
    verify:
      - "ruff check superset/daos/chart.py superset/reports/notifications/slackv2.py superset/mcp_service/chart/validation/runtime/format_validator.py"
      - "python -c \"import superset.daos.chart, superset.reports.notifications.slackv2; print('ok')\""

  - id: drill-to-detail-flag
    tier: 2
    class: code-quality
    title: "Retire the deprecated DRILL_TO_DETAIL feature flag and its dead branches"
    touch_scope: ["superset/config.py", "tests/integration_tests/superset_test_config.py"]
    problem: |
      `DRILL_TO_DETAIL` is marked `@lifecycle: deprecated` in
      `superset/config.py`, defaults to `True`, and is slated for removal in a
      future major release. Remove the flag from the backend feature-flag map
      and from `tests/integration_tests/superset_test_config.py`, along with any
      backend branch that is now dead.

      Judgement required: the frontend uses a *different* `DRILL_TO_DETAIL`
      symbol (`Behavior.DRILL_TO_DETAIL` and a translated label in
      `superset-frontend/src/components/Chart/`). Those are unrelated to the
      feature flag and must not be touched. If you find a backend consumer whose
      removal would change behaviour for someone who set the flag to `False`,
      stop and report `partial` with what you found rather than guessing.
    affected_paths: ["superset/config.py", "tests/integration_tests/superset_test_config.py"]
    acceptance:
      - "`DRILL_TO_DETAIL` no longer appears in the backend feature-flag map"
      - "No frontend file is modified"
      - "`python -c 'import superset.config'` still succeeds and the feature-flag unit tests pass"
    verify:
      - "python -m pytest tests/unit_tests/feature_flag_test.py tests/unit_tests/config_test.py -q"
      - "grep -rn 'DRILL_TO_DETAIL' superset/ || echo 'no backend references remain'"

  - id: yaml-unsafe-load
    tier: 3
    class: security
    title: "Example import loads YAML metadata with the unsafe loader"
    touch_scope: ["superset/examples/utils.py"]
    problem: |
      `superset/examples/utils.py` parses the metadata of an example bundle with
      `yaml.load(..., Loader=yaml.Loader)` (suppressed with `# noqa: S506`).
      `yaml.Loader` constructs arbitrary Python objects from tags such as
      `!!python/object/apply`, so any path that reaches this function with
      attacker-influenced content is a deserialisation sink.

      The fix is a judgement call, not a substitution: the loader must be
      tightened to one that cannot instantiate arbitrary objects, *and* the
      change has to keep parsing every metadata document the importer legitimately
      produces (including the timestamps that `yaml.safe_load` handles
      differently from `yaml.Loader`). Add a regression test that fails on the
      current code — i.e. one asserting that a document containing a Python
      object tag is rejected rather than constructed — and passes after the fix.
    affected_paths: ["superset/examples/utils.py", "tests/unit_tests/examples/utils_test.py"]
    acceptance:
      - "The metadata parse can no longer construct arbitrary Python objects"
      - "A new test in tests/unit_tests/examples/utils_test.py fails without the fix and passes with it — show both outputs in the PR body"
      - "Existing example-import tests still pass"
      - "The `# noqa: S506` suppression is removed rather than moved"
    verify:
      - "python -m pytest tests/unit_tests/examples/utils_test.py -q"

  - id: pickle-codec-hardening
    tier: 3
    class: security
    title: "PickleKeyValueCodec deserialises stored values with unrestricted pickle"
    touch_scope: ["superset/key_value/types.py"]
    problem: |
      `PickleKeyValueCodec.decode` calls `pickle.loads` on bytes read from the
      `key_value` table with no restriction on which classes may be constructed
      (`# noqa: S301`). Superset already ships the safer pattern: the migration
      in `superset/migrations/versions/2023-05-01_12-03_9c2a5681ddfd_convert_key_value_entries_to_json.py`
      defines a `RestrictedUnpickler` that raises `UnpicklingError` for anything
      outside an allow-list.

      Apply that pattern to the codec: restrict unpickling to the types Superset
      actually stores, raise `KeyValueCodecDecodeException` for anything else,
      and add a regression test that a payload referencing a disallowed callable
      (for example `os.system`) is rejected instead of executed. Do not change
      the encode path or the wire format of existing rows.
    affected_paths: ["superset/key_value/types.py", "tests/unit_tests/key_value/codec_test.py"]
    acceptance:
      - "Decoding a payload that references a disallowed global raises rather than constructing it"
      - "Round-tripping the value types Superset stores today still works — existing codec tests pass unchanged"
      - "A new regression test fails without the fix; show the before/after output in the PR body"
    verify:
      - "python -m pytest tests/unit_tests/key_value/codec_test.py -q"

  - id: session-invalidation-tz
    tier: 2
    class: code-quality
    title: "Cover the naive/aware boundary in session invalidation with explicit tests"
    touch_scope: ["tests/unit_tests/security/test_session_invalidation.py"]
    problem: |
      `superset/security/session_invalidation.py` compares a timezone-aware
      "now" against `sessions_invalidated_at`, a naive UTC column, via
      `_as_utc_timestamp`. The helper documents that a naive value must be
      treated as UTC — if it were ever treated as local time the comparison
      would skew by the machine's UTC offset and sessions would be invalidated
      early or never.

      That invariant currently rests on a comment. Add unit tests that pin it:
      a naive `sessions_invalidated_at` must produce the same epoch seconds as
      the equivalent aware UTC value, under a non-UTC `TZ`. Do not change the
      production module; if you believe it is wrong, say so in the PR body
      instead of altering behaviour.
    affected_paths: ["tests/unit_tests/security/test_session_invalidation.py"]
    acceptance:
      - "New tests assert naive-UTC and aware-UTC inputs agree, and that they still agree with TZ set to a non-UTC zone"
      - "No production module is modified"
      - "The new tests pass"
    verify:
      - "python -m pytest tests/unit_tests/security -q"
